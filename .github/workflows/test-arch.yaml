name: test-arch

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-wasm:
    name: Test js/wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: js
          GOARCH: wasm
        run: go build -v ./...

      - name: Vet
        env:
          GOOS: js
          GOARCH: wasm
        run: go vet ./...

      # wasm_exec forwards its complete environment to Node. Keep that
      # environment small enough for WebAssembly's argv+environment limit.
      - name: Run tests
        shell: bash
        run: |
          go_bin="$(go env GOROOT)/bin/go"
          wasm_exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec"
          env -i \
            HOME="$HOME" \
            PATH="$PATH" \
            TMPDIR="$RUNNER_TEMP" \
            GOCACHE="$RUNNER_TEMP/go-build" \
            GOOS=js \
            GOARCH=wasm \
            "$go_bin" test -exec="$wasm_exec" -v -count=1 -timeout=30m ./...

  test-cross-arch:
    name: Test ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # amd64 on Linux
          - goos: linux
            goarch: amd64
            os: ubuntu-latest
            race: true

          # 386 on Linux (no race detector). The most important row in this
          # matrix: fermat.go's arithmetic and the generic vector fallbacks
          # are written in terms of _W (the machine word size), so a 32-bit
          # word is a genuinely different code path.
          - goos: linux
            goarch: 386
            os: ubuntu-latest
            race: false

          # arm64 on Linux (cross-compile, executed under QEMU)
          - goos: linux
            goarch: arm64
            os: ubuntu-latest
            race: false
            use_qemu: true
            qemu_exec: qemu-aarch64-static

          # loong64 on Linux (portable arithmetic, executed under QEMU)
          - goos: linux
            goarch: loong64
            os: ubuntu-latest
            race: false
            use_qemu: true
            qemu_exec: qemu-loongarch64-static

          # arm64 on macOS (native)
          - goos: darwin
            goarch: arm64
            os: macos-latest
            race: true

          # amd64 on Windows
          - goos: windows
            goarch: amd64
            os: windows-latest
            race: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up QEMU
        if: matrix.use_qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -v ./...

      - name: Build (purego)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -tags purego -v ./...

      # asmdecl checks frame sizes and every FP reference against the Go
      # declarations, so vet must stay green on every assembly architecture,
      # not just the host one.
      - name: Vet
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go vet ./...

      - name: Vet (purego)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go vet -tags purego ./...

      - name: Run tests (with race detector)
        if: matrix.race
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go test -v -race -count=1 -timeout=20m ./...

      - name: Run tests (without race detector)
        if: ${{ !matrix.race && !matrix.use_qemu }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go test -v -count=1 -timeout=30m ./...

      - name: Run tests (QEMU)
        if: matrix.use_qemu
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go test -exec=${{ matrix.qemu_exec }} -v -count=1 -timeout=30m ./...

      # The fallback is a supported configuration, not dead code. Exercise it
      # on every architecture; assembly remains enabled in the default run
      # above so asmdecl can still validate frame sizes and FP references.
      - name: Run tests (purego)
        if: ${{ !matrix.use_qemu }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go test -tags purego -v -count=1 -timeout=30m ./...

      - name: Run tests (purego, QEMU)
        if: matrix.use_qemu
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go test -exec=${{ matrix.qemu_exec }} -tags purego -v -count=1 -timeout=30m ./...
